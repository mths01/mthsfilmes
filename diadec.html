  <style>
    .photo-gallery-section {
      padding-top: 40px; 
    }

    .photo-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
      gap: 16px; 
      padding: 0 52px 80px; 
      max-width: 1400px; 
      margin: 0 auto; 
    }
    
    .photo-item { 
      aspect-ratio: 3/2; 
      overflow: hidden; 
      border-radius: 8px; 
      cursor: pointer; 
      background: #1a1a1a;
      border: 2px solid transparent;
      transition: all 0.3s ease; 
      /* OTIMIZAÇÃO DE RENDERIZAÇÃO: Pula o processamento se estiver fora da tela */
      content-visibility: auto;
      contain-intrinsic-size: 300px 200px;
    }
    
    .photo-item img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      transition: transform 0.6s ease; 
    }
    
    .photo-item:hover {
      border-color: #e5b63a;
      box-shadow: 0 0 20px rgba(229, 182, 58, 0.4);
      transform: translateY(-5px);
      z-index: 2;
    }
    .photo-item:hover img { transform: scale(1.05); }

    .hero-btn-back { 
      display: inline-block; 
      margin-top: 25px; 
      color: #aaa; 
      text-decoration: none; 
      font-size: 11px; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      transition: color 0.3s; 
      font-family: 'Inter', sans-serif;
    }
    .hero-btn-back:hover { color: #e5b63a; }

    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(8px);
      align-items: center; justify-content: center; opacity: 0;
      transition: opacity 0.3s ease;
    }
    .lightbox.open { display: flex; opacity: 1; }
    .lightbox-img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .lightbox-close { position: absolute; top: 30px; right: 40px; font-size: 40px; color: #fff; cursor: pointer; background: none; border: none; transition: color 0.3s ease; }
    .lightbox-close:hover { color: #e5b63a; }

    /* ── ESTILOS DO NOVO RODAPÉ COM LINHA DOURADA E WHATSAPP PADRONIZADO ── */
    .site-footer {
      background-color: #050505;
      padding: 40px 20px 60px;
      text-align: center;
      position: relative;
      z-index: 10;
      border-top: 1px solid rgba(212, 175, 55, 0.25);
    }
    .footer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .footer-brand {
      font-family: 'Playfair Display', serif;
      color: #d4af37;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 0;
    }
    .footer-social {
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .footer-social a {
      color: #aaa;
      transition: color 0.3s ease, transform 0.3s ease;
      display: flex;
    }
    .footer-social a:hover {
      color: #d4af37;
      transform: scale(1.1);
    }
    .footer-social svg {
      width: 22px;
      height: 22px;
    }
    .footer-contact {
      color: #ccc;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      margin: 0;
    }
    .footer-copy {
      color: #555;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      margin: 0;
      margin-top: 10px;
    }

    .whatsapp-float {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background-color: #25d366;
      color: #fff;
      border-radius: 50px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      z-index: 9999;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .whatsapp-float:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
      color: #fff;
    }

    @media (max-width: 768px) {
      .photo-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); padding: 0 24px 60px; }
      .whatsapp-float { bottom: 20px; right: 20px; padding: 10px 20px; font-size: 13px; }
    }
  </style>

  <script src="assets/js/inner.js"></script>
  <script>
    const galleryGrid = document.getElementById('galeria-fotos');
    const galleryLightbox = document.getElementById('lightbox');
    const galleryImgFoco = document.getElementById('img-foco');
    const galleryCloseBtn = document.getElementById('close');

    // Usando DocumentFragment para injetar as 43 fotos de uma vez só (muito mais rápido)
    const fragment = document.createDocumentFragment();

    for (let i = 1; i <= 43; i++) {
      const div = document.createElement('div');
      div.className = 'photo-item';
      
      // Ajustado para o nome exato dos seus novos arquivos: photo (1).JPG
      div.innerHTML = `<img 
        src="assets/images/diadec/photo (${i}).JPG" 
        alt="Foto ${i}" 
        loading="lazy" 
        decoding="async"
        onerror="this.parentElement.style.display='none';"
      >`;

      div.onclick = function() {
        const img = this.querySelector('img');
        if(img && img.src) {
          galleryImgFoco.src = img.src;
          galleryLightbox.classList.add('open');
        }
      };

      fragment.appendChild(div);
    }
    
    // Insere tudo no grid de uma única vez
    galleryGrid.appendChild(fragment);

    galleryCloseBtn.onclick = function() {
      galleryLightbox.classList.remove('open');
      setTimeout(() => { galleryImgFoco.src = ""; }, 300);
    };

    galleryLightbox.onclick = function(e) {
      if (e.target === galleryLightbox) {
        galleryLightbox.classList.remove('open');
        setTimeout(() => { galleryImgFoco.src = ""; }, 300);
      }
    };
  </script>
